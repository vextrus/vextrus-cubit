# The review tiers' path lists, read by scripts/factory/review.py, scripts/factory/tiers.py and their
# tests. The no-model lists name what is SAFE, never the walls (PR #478 review, round 2), and they are
# kept SHORT: refining word lists to rescue more paths kept letting walls through (PR #489 review,
# round 1).
#
# - allowlist-only (no model) is decided in code: only 64-hex lines added to the leak-scan allowlist.
# - docs-only (no model, PASS by code): every changed path matches `docs_only.paths`, none matches
#   `docs_only.never`, and each is a text file (`.md` or `.txt` with a line count; checked in code).
# - risk (lens A and lens B; the refuter on every head): any changed path matches `risk.paths` OR
#   matches no `ordinary.paths` glob.
# - ordinary (one lens, lens B; the refuter on one head in five): every changed path matches
#   `ordinary.paths` and none `risk.paths`, whatever its size.
#
# RISK IS THE DEFAULT (lesson (e), as in `[strict]` below): PR #884 listed the walls and its review
# found one missed in each of two rounds, so `ordinary` names only plain product work and scripts/,
# tools/, .github/, .claude/, the root's files and any folder nobody listed are risk. The risk list
# still names walls (the owner's rulings Q5 and Q15, 14 Oct 2026: "the full panel on a risk tier
# written down as paths"), including the risk modules inside the ordinary folders. A missing or
# unreadable `risk` or `ordinary` list makes every path risk (scripts/factory/tiers.py). `ordinary`
# globs keep case, as `[lax]` does.
#
# Patterns are globs on the repository path: `*` is any run of characters but `/`, `**/` any number
# of folders (none included), a trailing `/**` everything below a folder. `never` and `risk` ignore case.

[docs_only]
# Plain reading for people: research notes, notes, the lessons list.
paths = [
  "docs/research/**",
  "docs/notes/**",
  "docs/knowledge/lessons.md",
]
# Instructions or authority an agent obeys or code reads: never without a model. Claude Code loads
# CLAUDE.md and CLAUDE.local.md in any folder it reads as instructions.
never = [
  "**/CLAUDE*.md",
  "**/AGENTS*.md",
  "**/*.local.md",
  "**/.*",
  "**/.*/**",
  "docs/plans/**",
  "docs/specs/**",
  "docs/adr/**",
  "docs/agents/**",
  "docs/handoff/**",  # the session brief the orchestrator obeys (CLAUDE.md "Start here")
  "docs/knowledge/jev-nodes.md",
]

[risk]
# The full panel (S29-F7; Q5, Q15). Judged against docs/architecture.md's module map and the tree. Out,
# by judgement: summary, exports, assistant and revisions (readings of boq's money, no money of their
# own), measurement (its quantities reach money only through takeoff and boq), drawings but its tenant
# wall and upload parser (its files are read in engine/read's sandbox, which is risk), live_model, seed,
# the web's view code: each is on `[ordinary] paths` below. Everything else outside both lists (the
# other tools/lint scans, the lockfiles, scripts/, .github/, .claude/) is risk by default.
paths = [
  # The engine: the hostile-drawing readers and the recognisers.
  "engine/**",
  "vextrus/takeoff/**",
  # Money.
  "vextrus/boq/**",
  "vextrus/rates/**",
  # Access and members: tenancy, RLS, Memberships, auth, invitations, ended access.
  "vextrus/platform/**",
  "vextrus/projects/**",
  "vextrus/settings/auth.py",
  "vextrus/settings/tenancy.py",
  "web/src/members/**",
  "web/src/auth/**",
  "web/src/routes/(auth)/**",
  # The API's sign-in and CSRF, the middleware, and the walls earlier reviews found outside those
  # modules (PR #489 round 1, finding 2): drawings' tenant wall and the upload parser that runs before
  # sign-in.
  "vextrus/api.py",
  "vextrus/routers.py",
  "vextrus/urls.py",
  "vextrus/settings/base.py",
  "vextrus/settings/db.py",
  "vextrus/settings/uploads.py",
  "vextrus/drawings/uploads.py",
  "vextrus/drawings/services/_access.py",
  # The real drawings' custody (nothing from them enters git).
  "scripts/real_drawings/**",
  # Any module's migrations.
  "**/migrations/**",
  # The factory's gate code, this list and its reader among it: a PR never relaxes its own tier.
  "scripts/factory/review*",
  "scripts/factory/tiers.py",
  "scripts/factory/ci_gate.py",
  "scripts/factory/publish.py",
  "scripts/factory/allowlist.py",
  "scripts/factory/trailers.py",
  "scripts/factory/lens_pytest.py",
  "scripts/factory/crosspr.py",
  "scripts/factory/trusted-authors.txt",
  "scripts/verify.py",
  "tools/lint/engine_paths.py",
  ".github/engine-paths.txt",
  "scripts/ledger.py",
  "scripts/merge_ready.py",
  "scripts/land.py",
  "tools/lint/acceptance*.py",
  "tools/leakscan/**",
  # What the gate code above imports or reads (PR #884 round 1 and its sweep): the flaky lists that
  # excuse a failed test (verify.py, land.py), the leak scan's commit finder (publish.py, allowlist.py,
  # verify.py), the review slots and the revert tier's
  # watcher (review.py), the acceptance check's legacy list and rulings register
  # (read at the base) and the import-linter configuration it looks for.
  ".github/flaky.txt",
  ".github/flaky-root.txt",
  "scripts/factory/leakwhere.py",
  "scripts/factory/governor.py",
  "scripts/factory/main_watch.py",
  "tools/lint/acceptance_legacy.txt",
  "docs/rulings.md",
  ".importlinter",
  "setup.cfg",
  # PR #884 round 2: the CI matrix's builder and its shard list (ci.yml's jobs come from them), and
  # what the real-drawing check's matcher reads beside .github/engine-paths.txt.
  "tools/lint/ci_shards.py",
  ".github/ci-shards.json",
  ".github/checkout-also.txt",
  ".github/workflows/**",
  # The hooks, the settings and the agents (review.py gives .claude/agents to its lenses as prompts).
  ".claude/hooks/**",
  ".claude/settings.json",
  ".claude/agents/**",
  "scripts/git-hooks/**",
  "scripts/factory/*.settings.json",
  # What an agent's tools and what pytest runs are read from (a gate's own configuration).
  ".mcp.json",
  "pyproject.toml",
  "conftest.py",
  # The scorer.
  "tools/scorer/**",
  # The files Claude Code loads as instructions in any folder (the docs-only never-list's), so none
  # is ordinary inside an ordinary folder.
  "**/CLAUDE*.md",
  "**/AGENTS*.md",
  "**/*.local.md",
]

[ordinary]
# Plain product work outside the risk modules, and nothing else (S29-F7-R): a path on no glob here is
# risk. `[risk] paths` above wins inside these folders (web/src/members, web/src/auth, the drawings
# wall, any migrations, docs/rulings.md, the instruction files).
paths = [
  # The web's product code and its tests.
  "web/src/**",
  # The modules docs/architecture.md maps that the risk list leaves out (its "Out, by judgement").
  "vextrus/assistant/**",
  "vextrus/drawings/**",
  "vextrus/exports/**",
  "vextrus/live_model/**",
  "vextrus/measurement/**",
  "vextrus/revisions/**",
  "vextrus/seed/**",
  "vextrus/summary/**",
  # The docs (plans, specs, ADRs, briefs and notes among them).
  "docs/**",
]

[strict]
# The review bar (the owner's ruling, 7 Oct 2026, session 17; ADR 0041 amended): a standing finding
# blocks at 75, or at 50 when its file is strict. Read by scripts/ledger.py (and, through it, by
# review.py and merge_ready) afresh for each decision.
#
# STRICT IS THE DEFAULT (lesson (e): PR #610 and PR #615 listed the walls for five rounds and missed
# one in each). A file is lax only when it matches a `[lax] paths` glob and no `[strict] paths` glob;
# everything else is strict: every other web file, the root's files, scripts/, tools/, vextrus/,
# engine/, .claude/, .github/ and a folder nobody listed. A finding with no file, or a file that is not
# a plain relative path (absolute, a drive, a backslash, a blank, an empty, `.`, `..` or hidden
# segment) or not a file of the head's tree, is strict. Strict globs match any trailing part of the
# path, case ignored, and `X/**` also matches `X`; lax globs match the whole path only, as written
# (case kept). A tiers file that is missing, unreadable, empty, or lists nothing lax or nothing strict
# judges every path strict.
#
# `paths` is the carve-out list: the walls inside the lax globs below, by name. The pinned table is
# scripts/tests/acceptance/ts17f6/_paths.py.
paths = [
  # Inside web/src/**/*.tsx: the API's transport and the routes.
  "web/src/api/**",
  "web/src/routes/**",
  # Anything that names auth or the session, anywhere below web/src/, inside a word too
  # (`OAuthButton.tsx`, `useAuth.tsx`, `AuthorBadge.tsx`, `sessions/`): a substring, not a word.
  "web/src/**/*auth*",
  "web/src/**/*auth*/**",
  "web/src/**/*session*",
  "web/src/**/*session*/**",
  # Permissions, kept from S17-F6's round-1 review (beyond lesson (e)'s list: it only adds strictness).
  "web/src/**/*permission*",
  "web/src/**/*permission*/**",
  # A wall's own tests are a wall.
  "web/src/**/*.test.tsx",
  "web/src/acceptance/**",
  # Inside docs/**/*.md: the Markdown a script, lint, hook or Claude Code reads at run time.
  "docs/rulings.md",  # tools/lint/acceptance_lint.py
  "docs/knowledge/**",  # lessons.md (stamp.py, docs_paths.py), jev-nodes.md (scripts/factory/jev.py)
  "docs/sdlc.md",  # tools/lint/docs_paths.py
  "docs/architecture.md",  # tools/lint/docs_paths.py
  "docs/agents/**",  # tools/lint/docs_paths.py
  "docs/design/**",  # web/scripts/lint-design-docs.mjs (web.yml), tools/lint/words.py
  "**/CLAUDE*.md",  # Claude Code loads it as instructions, in any folder
  "**/AGENTS*.md",
  # Inside the session-24 engine globs below: the hostile-PDF sandbox (pdfium under bubblewrap).
  "engine/plot/*picture*",
]

[lax]
# The only places where a standing finding of 50-74 does not block (it takes the 75 bar and is filed
# as an issue): the web's view components and the docs' Markdown, less `[strict] paths` above.
paths = [
  "web/src/**/*.tsx",
  "docs/**/*.md",
]
