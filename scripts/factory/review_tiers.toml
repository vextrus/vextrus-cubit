# The review tiers' path lists, read by scripts/factory/review.py and its tests. The lists name what
# is SAFE, never the walls (PR #478 review, round 2), and they are kept SHORT: refining word lists to
# rescue more paths kept letting walls through (PR #489 review, round 1).
#
# - allowlist-only (no model) is decided in code: only 64-hex lines added to the leak-scan allowlist.
# - docs-only (no model, PASS by code): every changed path matches `docs_only.paths`, none matches
#   `docs_only.never`, and each is a text file (`.md` or `.txt` with a line count; checked in code).
# - small (one lens): under 150 changed lines, no binary file, every changed path matches
#   `small.paths` and none matches `small.never`.
# - normal (two lenses): everything else. A path nobody listed is normal; every test change is normal.
#
# Patterns are globs on the repository path: `*` is any run of characters but `/`, `**/` any number
# of folders (none included), a trailing `/**` everything below a folder. `never` ignores case.

[docs_only]
# Plain reading for people: research notes, notes, the lessons list.
paths = [
  "docs/research/**",
  "docs/notes/**",
  "docs/knowledge/lessons.md",
]
# Instructions or authority an agent obeys or code reads: never without a model. Claude Code loads
# CLAUDE.md and CLAUDE.local.md in any folder it reads as instructions.
never = [
  "**/CLAUDE*.md",
  "**/AGENTS*.md",
  "**/*.local.md",
  "**/.*",
  "**/.*/**",
  "docs/plans/**",
  "docs/specs/**",
  "docs/adr/**",
  "docs/agents/**",
  "docs/handoff/**",  # the session brief the orchestrator obeys (CLAUDE.md "Start here")
  "docs/knowledge/jev-nodes.md",
]

[small]
# One lens only for the translation catalogues (their words also get the ux-critic words lens).
# `web/src/components/**` is the one other entry: the S14-R1 acceptance tests pin a three-line badge
# component as small (test_tier.py, test_a_small_pr_gets_one_lens), and acceptance tests never change.
paths = [
  "web/src/messages/**/*.po",
  "web/src/messages/**/*.json",
  "web/src/components/**",
]
# No test, ever (a wall's own tests are a wall), and no instruction file or dotfile.
never = [
  "**/CLAUDE*.md",
  "**/AGENTS*.md",
  "**/*.local.md",
  "**/.*",
  "**/.*/**",
  "docs/plans/**",
  "docs/specs/**",
  "docs/adr/**",
  "docs/agents/**",
  "docs/handoff/**",
  "docs/knowledge/jev-nodes.md",
  "**/tests/**",
  "**/test/**",
  "**/__tests__/**",
  "**/acceptance/**",
  "**/test_*",
  "**/*_test.*",
  "**/*.test.*",
  "**/*.spec.*",
  "**/conftest.py",
]

[strict]
# The review bar (the owner's ruling, 7 Oct 2026, session 17; ADR 0041 amended): a standing finding
# blocks at 75, or at 50 when its file matches one of these paths. Read by scripts/ledger.py (and,
# through it, by review.py and merge_ready). Unlike the lists above, this one names the walls: a
# finding with no file, or a file that is not a plain relative path (absolute, a drive, a backslash,
# a blank, a `..`), is judged strict; a glob matching any trailing part of the path counts. Case
# ignored.
paths = [
  # Security walls: tenancy and row-level security, sign-in and auth, the guard.
  "**/*tenancy*",
  "**/*tenancy*/**",
  "**/*row_level*",
  "**/auth.py",
  "**/auth/**",
  "vextrus/platform/database.py",
  "vextrus/platform/http/**",
  "web/src/app/session.ts",
  ".claude/hooks/**",
  ".claude/settings.json",
  # Migrations.
  "**/migrations/**",
  # Money: the BOQ, rates.
  "vextrus/boq/**",
  "vextrus/rates/**",
  "vextrus/platform/money.py",
  # Readers: the engine's drawing readers (and its families, when they come).
  "engine/read/**",
  "engine/families/**",
]
