[project]
name = "vextrus-cad"
version = "0.1.0"
description = "Format-to-EntityGraph extraction for Vextrus Cubit (L-CAD-01)."
readme = "README.md"
requires-python = ">=3.13,<3.14"
# Pinned exactly: the extractor's identity is part of every source key's scope (L-CAD-02), and the
# committed artifacts regenerate byte-for-byte only against the version that minted them.
dependencies = ["ezdxf==1.4.4"]

[project.scripts]
vextrus-cad = "vextrus_cad.cli:main"

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.16.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vextrus_cad"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
