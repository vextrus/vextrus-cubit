[project]
name = "cubit-cad"
version = "0.0.0"
description = "The cad/ CLI: DWG/DXF/PDF ingest, vectorisation and render manifests. Python is a subprocess, never a service."
requires-python = ">=3.13,<3.14"
dependencies = []

# The ingest dependencies (ezdxf, pypdfium2, OpenCV, numpy) arrive pinned with the
# increment that delivers the ingest code. What is pinned here is the interpreter and the
# two tools the gate runs: `ruff check` in every verify, `pytest` from the increment that
# writes cad/tests.
[dependency-groups]
dev = [
    "ruff==0.16.4",
    "pytest==9.1.1",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
