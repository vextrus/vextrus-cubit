[project]
name = "vextrus-cad"
version = "0.1.0"
description = "Format-to-EntityGraph extraction for Vextrus Cubit (L-CAD-01)."
readme = "README.md"
requires-python = ">=3.13,<3.14"
# Pinned exactly: the extractor's identity is part of every source key's scope (L-CAD-02), and the
# committed artifacts regenerate byte-for-byte only against the version that minted them. ezdxf reads
# DXF (DXF_HANDLE keys); pypdfium2 reads vector PDF (PDF_OBJECT keys, L-CAD-04's permissive reader) —
# moving either re-keys the corpora it minted and is a declared re-ingest, never a routine bump.
# opencv-python-headless is the raster lane's vectoriser (R-TO-003, AS-04: "OpenCV, numpy pinned"),
# its version half of every RASTER_TRACE key's scope, and numpy — which its rotations are computed by
# — is pinned beside it and hashed into the raster parameter set; moving either re-keys every traced
# corpus. Licence: the wheel is Apache-2.0, and it bundles LGPL-licensed FFmpeg and OpenSSL 1.1.1k as
# shared libraries (the wheel's own LICENSE-3RD-PARTY); neither is the AGPL PDF stack L-CAD-04 bans.
dependencies = ["ezdxf==1.4.4", "numpy==2.5.2", "opencv-python-headless==4.13.0.90", "pypdfium2==5.13.0"]

[project.scripts]
vextrus-cad = "vextrus_cad.cli:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-xdist==3.8.0",
    "ruff==0.16.8",
]
# Fixture generation only (D-04: reportlab is acceptable in fixtures generation, never in the app).
# `uv run --group fixtures` leaves these resident in the shared .venv, so a stray import would pass
# locally; cad/tests/sanity/test_fixtures_group.py scans src/vextrus_cad for one on every run.
# pypdfium2 left this group for the shipped dependencies when the PDF lane landed (R-TO-002).
fixtures = ["reportlab==4.4.9", "pillow==12.3.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vextrus_cad"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
# The suite's own helper module sits beside the tests rather than inside the package, so name both
# halves of this project explicitly; import order should not depend on where ruff was invoked from.
known-first-party = ["corpus", "vextrus_cad"]
