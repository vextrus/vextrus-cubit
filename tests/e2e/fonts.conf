<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  The V-E2E lane's font resolution (Q-06, V-E2E: "visual comparisons against committed Linux
  baselines", maxDiffPixelRatio 0.002).

  src/ui/tokens.css names families the repository does not ship: the font-ui token reads
  `Inter, 'Helvetica Neue', Arial, sans-serif` and the font-mono token reads `'JetBrains Mono',
  'SF Mono', Consolas, monospace`. Which face each resolves to is a property of the host, not
  of this tree, and the hosts differ: a developer box may carry only DejaVu, while a GitHub
  ubuntu-24.04 runner gets fonts-liberation from `playwright install chromium` (with its deps)
  and fontconfig
  aliases Arial onto Liberation Sans — which sits ahead of `sans-serif` in the stack. The two
  machines then paint different glyph advances on every string of an 8000-px full-page
  screenshot, and the committed baseline is red on a tree nobody changed.

  This file removes the host from the decision. Every family the token stack can reach is
  assigned — not merely preferred — onto the DejaVu faces, so the baseline is a property of
  the repository. scripts/e2e.mjs points FONTCONFIG_FILE here for every process it starts, and
  the CI job installs fonts-dejavu-core so the runner has the faces named below.

  `mode="assign"` (rather than an <alias><prefer>) is deliberate: a preference still loses to
  the requested family when the host happens to have it installed, which is exactly the
  divergence being closed. A host with no DejaVu draws a visibly different page and reddens
  the baseline loudly, which is the right outcome — not a silent substitution.
-->
<fontconfig>
  <dir>/usr/share/fonts</dir>
  <dir>/usr/local/share/fonts</dir>
  <dir prefix="xdg">fonts</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>

  <!-- Sans: the font-ui and font-doc stacks, and their generic tail. -->
  <match target="pattern">
    <test qual="any" name="family">
      <string>Inter</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>DejaVu Sans</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family">
      <string>Helvetica Neue</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>DejaVu Sans</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family">
      <string>Helvetica</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>DejaVu Sans</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family">
      <string>Arial</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>DejaVu Sans</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family">
      <string>Noto Sans</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>DejaVu Sans</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>DejaVu Sans</string>
    </edit>
  </match>

  <!-- Mono: the font-mono stack, the numerals R-UI-003 sets in it, and the generic tail. -->
  <match target="pattern">
    <test qual="any" name="family">
      <string>JetBrains Mono</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>DejaVu Sans Mono</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family">
      <string>SF Mono</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>DejaVu Sans Mono</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family">
      <string>Consolas</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>DejaVu Sans Mono</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family">
      <string>monospace</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>DejaVu Sans Mono</string>
    </edit>
  </match>

  <!-- Serif, which no token names but a browser default can still reach. -->
  <match target="pattern">
    <test qual="any" name="family">
      <string>serif</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>DejaVu Serif</string>
    </edit>
  </match>

  <!-- The last word, for a pattern that named no family at all. -->
  <match target="pattern">
    <edit name="family" mode="append_last" binding="same">
      <string>DejaVu Sans</string>
    </edit>
  </match>

  <!-- Rendering itself, so a host's own hinting/antialias defaults cannot move a pixel. -->
  <match target="font">
    <edit name="antialias" mode="assign">
      <bool>true</bool>
    </edit>
    <edit name="hinting" mode="assign">
      <bool>true</bool>
    </edit>
    <edit name="hintstyle" mode="assign">
      <const>hintslight</const>
    </edit>
    <edit name="rgba" mode="assign">
      <const>none</const>
    </edit>
    <edit name="lcdfilter" mode="assign">
      <const>lcddefault</const>
    </edit>
    <edit name="embeddedbitmap" mode="assign">
      <bool>false</bool>
    </edit>
  </match>
</fontconfig>
