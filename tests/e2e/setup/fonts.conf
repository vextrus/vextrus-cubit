<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  The lane's font configuration (V-E2E, risk note 5).

  The baselines under tests/e2e/baselines/ are committed pixels compared at
  maxDiffPixelRatio 0.002, so which face a machine happens to prefer for `sans-serif` is
  part of the contract rather than part of the machine. scripts/e2e.mjs points
  FONTCONFIG_FILE at this file, which replaces the system configuration entirely — hence
  the <dir> lines: without them fontconfig would find no fonts at all.

  DejaVu is the choice because it is on both sides of the comparison: AS-01's WSL2 Ubuntu
  and CI's ubuntu-24.04 runner both ship fonts-dejavu-core.

  Three generic aliases are not enough on their own. A page that names no font-family is
  rendered through Chromium's *standard* family, which on Linux is `Times New Roman` — a
  concrete name, not a generic one. With /etc/fonts/conf.d out of the picture there is no
  30-metric-aliases.conf to catch it, so an unaliased name falls through to fontconfig's
  sort over the whole installed set, and the winner is whatever else the machine happens to
  carry (CI's `playwright install --with-deps chromium` adds fonts-liberation and noto).
  Two rules close that:

    the <dir> list is the DejaVu directory and nothing else, so the set fontconfig sorts
    over is the same eight faces on every machine, whatever else is installed; and

    a weak `append_last` of DejaVu Sans on every pattern, so a family nobody declared —
    `Times New Roman`, a future stylesheet's typo — resolves by a rule in this file rather
    than by a sort. Checked with `FONTCONFIG_FILE=… fc-match "Times New Roman"`, which
    answers DejaVuSans.ttf here and cannot answer anything else anywhere.

  A machine without fonts-dejavu-core therefore sees no fonts at all and the baselines fail
  everywhere at once, which is the honest failure: a font set that is nearly right is what
  produces the coin-flip red.
-->
<fontconfig>
  <dir>/usr/share/fonts/truetype/dejavu</dir>
  <dir>/usr/share/fonts/dejavu</dir>
  <dir>/usr/local/share/fonts/dejavu</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>

  <alias>
    <family>sans-serif</family>
    <prefer><family>DejaVu Sans</family></prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer><family>DejaVu Serif</family></prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer><family>DejaVu Sans Mono</family></prefer>
  </alias>

  <!-- The last family on every pattern, bound weakly so a declared family still wins: an
       unknown name is answered by DejaVu Sans instead of by a whole-font-set sort. -->
  <match target="pattern">
    <edit name="family" mode="append_last" binding="weak"><string>DejaVu Sans</string></edit>
  </match>

  <!-- Hinting and antialiasing are rendering decisions, and a baseline is a rendering.
       Pinned here so that a machine's own fontconfig defaults cannot move the pixels. -->
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
  </match>
</fontconfig>
