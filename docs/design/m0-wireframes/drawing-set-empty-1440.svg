<text x="202" y="25" font-size="13" fill="#5F6772" font-weight="400" text-anchor="start">Takeoff</text>
<text x="286" y="25" font-size="13" fill="#262B33" font-weight="500" text-anchor="start">Drawing Set</text>
<rect x="284" y="38" width="92" height="2" rx="0" fill="#5A4FB0"/>
