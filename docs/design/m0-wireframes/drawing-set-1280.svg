<text x="816" y="304" font-size="12" fill="#4A515B" font-weight="600" text-anchor="start">Bangla text</text>
<text x="816" y="324" font-size="13" fill="#8A5100" font-weight="400" text-anchor="start">⚠ 9 texts on 2 sheets are Bangla typed in an old</text>
<text x="816" y="342" font-size="13" fill="#8A5100" font-weight="400" text-anchor="start">Bijoy-style font (SutonnyMJ). They show as Latin letters,</text>
<text x="816" y="360" font-size="13" fill="#8A5100" font-weight="400" text-anchor="start">as in AutoCAD, and Vextrus cannot read them.</text>
<text x="816" y="378" font-size="13" fill="#8A5100" font-weight="400" text-anchor="start">If they matter, ask the consultant for a Unicode Bangla font.</text>
<line x1="800" y1="404" x2="1280" y2="404" stroke="#D6D9D8" stroke-width="1"/>
