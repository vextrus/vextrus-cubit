<text x="816" y="152" font-size="13" fill="#262B33" font-weight="400" text-anchor="start">✓ Read twice, by two independent readers, and they agree.</text>
<text x="816" y="170" font-size="13" fill="#262B33" font-weight="400" text-anchor="start">Nothing in the file was skipped.</text>
<line x1="800" y1="196" x2="1280" y2="196" stroke="#D6D9D8" stroke-width="1"/>
<text x="816" y="218" font-size="12" fill="#4A515B" font-weight="600" text-anchor="start">Sheets</text>
<text x="816" y="238" font-size="13" fill="#262B33" font-weight="400" text-anchor="start">8 sheets found: 6 laid out in the drawing, 2 on layout tabs.</text>
<text x="816" y="256" font-size="13" fill="#262B33" font-weight="400" text-anchor="start">Open them in Takeoff Step 1.</text>
