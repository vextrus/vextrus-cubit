<text x="816" y="446" font-size="13" fill="#262B33" font-weight="400" text-anchor="start">4 fonts named in the drawing. Vextrus draws each with a</text>
<text x="816" y="464" font-size="13" fill="#262B33" font-weight="400" text-anchor="start">free font of the same shape:</text>
<rect x="816" y="484" width="448" height="26" rx="0" fill="#EFF0EF"/>
<text x="824" y="502" font-size="12" fill="#4A515B" font-weight="600" text-anchor="start">The drawing asks for</text>
<text x="994" y="502" font-size="12" fill="#4A515B" font-weight="600" text-anchor="start">Drawn with</text>
<text x="1144" y="502" font-size="12" fill="#4A515B" font-weight="600" text-anchor="start">How close</text>
<rect x="816" y="510" width="448" height="26" rx="0" fill="#FFFFFF"/>
<line x1="816" y1="536" x2="1264" y2="536" stroke="#D6D9D8" stroke-width="1"/>
<text x="824" y="528" font-size="13" fill="#262B33" font-weight="400" text-anchor="start">Arial</text>
<text x="994" y="528" font-size="13" fill="#262B33" font-weight="400" text-anchor="start">Liberation Sans</text>
<text x="1144" y="528" font-size="13" fill="#262B33" font-weight="400" text-anchor="start">Same widths</text>
<rect x="816" y="536" width="448" height="26" rx="0" fill="#FFFFFF"/>
<line x1="816" y1="562" x2="1264" y2="562" stroke="#D6D9D8" stroke-width="1"/>
<text x="824" y="554" font-size="13" fill="#262B33" font-weight="400" text-anchor="start">Romans (AutoCAD)</text>
<text x="994" y="554" font-size="13" fill="#262B33" font-weight="400" text-anchor="start">Single-stroke</text>
<text x="1144" y="554" font-size="13" fill="#262B33" font-weight="400" text-anchor="start">Like the plot</text>
<rect x="816" y="562" width="448" height="26" rx="0" fill="#FFFFFF"/>
<line x1="816" y1="588" x2="1264" y2="588" stroke="#D6D9D8" stroke-width="1"/>
<text x="824" y="580" font-size="13" fill="#262B33" font-weight="400" text-anchor="start">Swiss 721 Condensed</text>
<text x="994" y="580" font-size="13" fill="#262B33" font-weight="400" text-anchor="start">Liberation Narrow</text>
<text x="1144" y="580" font-size="13" fill="#8A5100" font-weight="400" text-anchor="start">A little wider</text>
<rect x="816" y="588" width="448" height="26" rx="0" fill="#FFFFFF"/>
<line x1="816" y1="614" x2="1264" y2="614" stroke="#D6D9D8" stroke-width="1"/>
