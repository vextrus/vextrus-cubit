<text x="574.0" y="483.0" font-size="13" fill="#262B33" font-weight="400" text-anchor="start">••••••••••</text>
<rect x="564.0" y="512.0" width="312" height="32" rx="4" fill="#5A4FB0"/>
<text x="720.0" y="532.5" font-size="13" fill="#fff" font-weight="500" text-anchor="middle">Sign in</text>
<text x="564.0" y="574.0" font-size="12" fill="#5F6772" font-weight="400" text-anchor="start">Forgot your password? Ask your MD, or Vextrus,</text>
