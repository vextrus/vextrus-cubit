<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" font-family="Archivo, Arial, sans-serif">
<title>Sign-in at 1440x900 (invented)</title>
<rect x="0" y="0" width="1440" height="900" rx="0" fill="#E9EBEA"/>
<rect x="540.0" y="280.0" width="360" height="330" rx="8" fill="#FFFFFF" stroke="#D6D9D8" stroke-width="1"/>
<rect x="564.0" y="304.0" width="24" height="24" rx="3" fill="#5A4FB0"/>
<text x="598.0" y="322.0" font-size="16" fill="#262B33" font-weight="600" text-anchor="start">Vextrus</text>
<text x="564.0" y="364.0" font-size="20" fill="#262B33" font-weight="600" text-anchor="start">Sign in</text>
<text x="564.0" y="394.0" font-size="12" fill="#4A515B" font-weight="600" text-anchor="start">Email</text>
<rect x="564.0" y="400.0" width="312" height="32" rx="4" fill="#FFFFFF" stroke="#7F868D" stroke-width="1"/>
<text x="574.0" y="421.0" font-size="13" fill="#262B33" font-weight="400" text-anchor="start">nusrat@shapla-homes.example</text>
