# The web's checks (docs/plans/M0.md, ticket 01b): typecheck, lint, Vitest, the catalogue check and
# the build for any change under web/ (or to the backend and the engine's messages, which make the API
# types), and the design-docs lint on every PR.
#
# Never filtered by path at the workflow level (a skipped workflow leaves a required check waiting):
# the `web` job skips by `if:` from the `changes` job instead, which also saves minutes.
# The API types are generated from the backend's schema before the typecheck (ticket 03).
name: web

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: web-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}   # as ci.yml: a run on main is never cancelled

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      web: ${{ steps.diff.outputs.web }}
      ready: ${{ steps.gate.outputs.ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        # Fails closed: `git diff` runs as its own command under `shell: bash` (-e -o pipefail), so a
        # failed one (a bad BASE) fails the step, and so `web`, instead of reading as "nothing touched".
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then echo "web=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          changed=$(git diff --name-only "$BASE"...HEAD)
          # The backend and the engine's messages too: they make the API types, and a code added
          # without English must fail its own PR (the message-code test; the reviews A5, R7). And the
          # engine's renderer: the web's pixel checks compare the viewer with its rasters (122).
          touched=$(grep -E '^(web/|\.github/workflows/web\.yml$|vextrus/|engine/messages/|engine/collect\.py$|engine/render/)' <<< "$changed" || true)
          if [ -n "$touched" ]; then echo "web=true"; else echo "web=false"; fi >> "$GITHUB_OUTPUT"
      - id: gate
        name: Is this head READY? (a pull request's heavy jobs run only then; main's always do)
        # Fails closed: a commit the gate cannot read fails the step, and so the roll-up. The runner sets
        # GITHUB_EVENT_NAME; standard library only (scripts/factory/ci_gate.py; issue #466).
        shell: bash
        env:
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 -m scripts.factory.ci_gate "$HEAD" >> "$GITHUB_OUTPUT"

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true' && needs.changes.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Chromium for Vitest's browser mode
        run: npx playwright install --with-deps chromium
      # The generated API types (ticket 03; a named shared edit, the reviews A5): the backend exports
      # its OpenAPI schema (no database needed) and openapi-typescript writes src/api/schema.gen.ts,
      # never committed. The message-code test reads its MessageCode enum.
      - id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install the backend's locked dependencies, building nothing
        working-directory: .
        env:
          UV_PYTHON: ${{ steps.python.outputs.python-path }}
          UV_PYTHON_DOWNLOADS: never
        run: uv sync --locked --no-build
      - name: API types (from the backend's OpenAPI schema)
        run: npm run api:types
      - name: Typecheck
        run: npm run typecheck
      - name: Lint (the catalogue lint, the logical-CSS lint, one key map)
        run: npm run lint
      - name: Catalogue check (extracted and compiled strictly)
        run: npm run messages:check
      - name: Words lint (no engine term or wrong words in a catalogue's English)
        working-directory: .
        run: uv run python -m tools.lint.words
      - name: Vitest (node and Chromium)
        run: npm test
      # The in-memory API slowed (#134): every FakeApi answer waits this long, so a test that reads an
      # answer before awaiting it fails here at once instead of now and then on a slow runner.
      - name: Vitest with the fake API slowed (60 ms an answer)
        env:
          VITE_FAKE_API_LATENCY_MS: "60"
        run: npm test
      - name: Build (fails if the specimen or the pseudo language ships)
        run: npm run build

  design-docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Design-docs lint
        run: node web/scripts/lint-design-docs.mjs
