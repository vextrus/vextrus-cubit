# The browser smoke test (ticket 22, was 27; docs/plans/M0.md "22 Step 1 screen and the browser smoke
# test"): sign in, upload a synthetic DWG, see the sheet list, open a sheet, confirm, on the whole stack
# served as it is locally (CLAUDE.md, "Commands"): PostgreSQL, migrate, seed_demo, the API, the job
# workers (the CAD queue's on the toolchain at its pins, installed as engine.yml installs it) and the
# web's dev server.
#
# The DWG is 13's synthetic set A, built by the repo's writer; never a real drawing. The demo password is
# made for this run only and masked. The real-set walk (G1) never runs here: it runs locally only.
name: e2e

# On each pull request, each commit to main and nightly (docs/specs/factory.md 3.9; the owner's Q-R6:
# e2e becomes required once it runs on PRs). By hand too. Required checks are never filtered by path
# at the workflow level (a skipped workflow leaves a required check waiting): the `changes` job
# decides, and `smoke` is skipped by its `if:` on a PR that changes no product path or whose head is
# not READY, which GitHub reports as passing, as ci.yml does for its heavy jobs.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 21 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      product: ${{ steps.paths.outputs.product }}
      ready: ${{ steps.gate.outputs.ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: paths
        name: Does this change touch a product path? (the list of scripts/walk/ready.py)
        # Fails closed: `git diff` runs as its own command under `shell: bash` (-e -o pipefail), so a
        # failed one (a bad BASE) fails the step, and so `smoke`, instead of reading as "untouched".
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != pull_request ]; then echo product=true >> "$GITHUB_OUTPUT"; exit 0; fi
          changed=$(git diff --name-only "$BASE"...HEAD)
          touched=$(grep -E '^(vextrus/|engine/|web/src/|pyproject\.toml$|uv\.lock$)' <<< "$changed" || true)
          if [ -n "$touched" ]; then echo product=true; else echo product=false; fi >> "$GITHUB_OUTPUT"
      - id: gate
        name: Is this head READY? (a pull request's smoke runs only then; main's always does)
        # Fails closed, as ci.yml's gate (scripts/factory/ci_gate.py; issue #466).
        shell: bash
        env:
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 -m scripts.factory.ci_gate "$HEAD" >> "$GITHUB_OUTPUT"

  smoke:
    needs: changes
    if: needs.changes.outputs.product == 'true' && needs.changes.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:18.6
        env:
          # Throwaway values for this job's container only; never a real secret.
          POSTGRES_PASSWORD: ci-throwaway-superuser
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://vextrus_app:ci-throwaway-app@127.0.0.1:5432/vextrus
      DATABASE_OWNER_URL: postgresql://vextrus:ci-throwaway-owner@127.0.0.1:5432/vextrus
      UV_PYTHON_INSTALL_DIR: /opt/vextrus/python
      UV_PYTHON_PREFERENCE: only-managed
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Make /opt/vextrus for the installs (it goes back to root before the stack starts)
        run: sudo install -d -o "$(id -u)" -g "$(id -g)" /opt/vextrus
      - name: Python at its pin
        run: |
          UV_PYTHON_INSTALL_DIR=/opt/vextrus/python \
            uv python install --no-bin "$(tr -d '[:space:]' < toolchain/python.version)"
      - name: LibreDWG from its release asset, by the sha256 published with it
        run: |
          V=$(tr -d '[:space:]' < toolchain/libredwg.version)
          ASSET="libredwg-$V-ubuntu24.04-x86_64.tar.gz"
          gh release download "toolchain-libredwg-$V" -R "$GITHUB_REPOSITORY" -p "$ASSET" -p "$ASSET.sha256" -D "$RUNNER_TEMP"
          (cd "$RUNNER_TEMP" && sha256sum -c "$ASSET.sha256")
          tar -xzf "$RUNNER_TEMP/$ASSET" -C / --no-same-owner opt/vextrus/libredwg
      - name: The .NET SDK at its pin
        run: |
          curl -fsSL https://dot.net/v1/dotnet-install.sh -o "$RUNNER_TEMP/dotnet-install.sh"
          bash "$RUNNER_TEMP/dotnet-install.sh" --version "$(tr -d '[:space:]' < toolchain/dotnet.version)" \
            --install-dir /opt/vextrus/dotnet --no-path
      - name: The ACadSharp dumper, built from tools/acadsharp-dump with that SDK, installed only at its pin
        # As scripts/owner/toolchain.sh's install_acadsharp_dump does, minus root: the folder is the
        # pin's first 12 hex, which the engine reads from toolchain/acadsharp-dump.sha256.
        run: |
          set -euo pipefail
          PREFIX=/opt/vextrus
          PINS="$GITHUB_WORKSPACE/toolchain"
          TOOL="$GITHUB_WORKSPACE/tools/acadsharp-dump"
          pinned=$(cut -d" " -f1 toolchain/acadsharp-dump.sha256)
          dest="/opt/vextrus/acadsharp-dump/${pinned:0:12}"
          build=$(mktemp -d "$PREFIX/.acadsharp-dump-build.XXXXXX")
          source="$build/src"
          out="$build/out"
          mkdir -p "$source/acadsharp" "$build/tmp"
          cp "$TOOL/acadsharp-dump.csproj" "$TOOL/Program.cs" "$TOOL/packages.lock.json" "$TOOL/global.json" "$source/"
          cp "$TOOL/acadsharp/ACadSharp.csproj" "$TOOL/acadsharp/packages.lock.json" "$source/acadsharp/"
          dotnet_here() {
            ( cd "$source" && DOTNET_CLI_TELEMETRY_OPTOUT=1 DOTNET_NOLOGO=1 DOTNET_CLI_HOME="$build/home" \
              NUGET_PACKAGES="$build/nuget" TMPDIR="$build/tmp" "$PREFIX/dotnet/dotnet" "$@" "$source" \
              -noAutoResponse -nodeReuse:false -p:ImportDirectoryBuildProps=false \
              -p:ImportDirectoryBuildTargets=false -p:ImportDirectoryPackagesProps=false )
          }
          bash "$TOOL/prepare-source.sh" --lock "$PINS/acadsharp-source.lock" --dest "$source/upstream"
          dotnet_here restore
          ( cd "$build/nuget/microsoft.netcore.app.runtime.linux-x64/"*/ &&
            sha512sum -c --quiet "$PINS/acadsharp-dump.runtime.sha512" )
          dotnet_here publish -c Release -o "$out" --no-restore
          built=$(sha256sum "$out/acadsharp-dump" | cut -d' ' -f1)
          if [ "$built" != "$pinned" ]; then
            echo "acadsharp-dump built as $built, not the pin $pinned: not installed" >&2
            exit 1
          fi
          runtime=$(echo "$build"/nuget/microsoft.netcore.app.runtime.linux-x64/*)
          install -d -m 0755 "$dest"
          install -m 0644 "$TOOL/ACADSHARP-LICENSE.txt" "$dest/ACADSHARP-LICENSE.txt"
          install -m 0644 "$runtime/LICENSE.TXT" "$dest/DOTNET-LICENSE.TXT"
          install -m 0644 "$runtime/THIRD-PARTY-NOTICES.TXT" "$dest/DOTNET-THIRD-PARTY-NOTICES.TXT"
          install -m 0755 "$out/acadsharp-dump" "$dest/acadsharp-dump"
          rm -rf -- "$build"
          test "$(sha256sum "$dest/acadsharp-dump" | cut -d' ' -f1)" = "$pinned"
      - name: Bubblewrap, and the AppArmor limit on unprivileged user namespaces lifted
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install the locked dependencies, building nothing
        env:
          UV_PYTHON_DOWNLOADS: never
        run: |
          UV_PYTHON_INSTALL_DIR=/opt/vextrus/python \
            uv sync --locked --no-build --python "$(tr -d '[:space:]' < toolchain/python.version)"
      - name: Hand /opt/vextrus to root, readable by all and writable by none
        run: |
          sudo chown -R root:root /opt/vextrus
          sudo chmod -R a+rX,go-w /opt/vextrus
      - name: Create the two roles (scripts/owner/db-roles.sql), with throwaway passwords
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: ci-throwaway-superuser
        run: |
          psql -v ON_ERROR_STOP=1 -d postgres -f scripts/owner/db-roles.sql
          psql -v ON_ERROR_STOP=1 -d postgres \
            -c "ALTER ROLE vextrus PASSWORD 'ci-throwaway-owner'" \
            -c "ALTER ROLE vextrus_app PASSWORD 'ci-throwaway-app'"
      - name: A demo password for this run only
        run: |
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          echo "VEXTRUS_DEMO_PASSWORD=$password" >> "$GITHUB_ENV"
      - name: The database and the seed
        run: |
          uv run --no-sync manage.py ensure_database
          uv run --no-sync manage.py migrate
          uv run --no-sync manage.py seed_demo
      - name: The web's dependencies and Chromium
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run routes
      - name: Serve the API, the job workers and the web
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          VEXTRUS_DEBUG=1 nohup uv run --no-sync manage.py runserver 127.0.0.1:8000 --noreload > "$RUNNER_TEMP/logs/api.txt" 2>&1 &
          nohup uv run --no-sync manage.py worker --queue cad > "$RUNNER_TEMP/logs/worker-cad.txt" 2>&1 &
          nohup uv run --no-sync manage.py worker > "$RUNNER_TEMP/logs/worker.txt" 2>&1 &
          nohup npm --prefix web run dev > "$RUNNER_TEMP/logs/web.txt" 2>&1 &
          for url in http://127.0.0.1:8000/api/auth/csrf http://127.0.0.1:5410/; do
            for _ in $(seq 60); do curl -fsS -o /dev/null "$url" && break; sleep 2; done
            curl -fsS -o /dev/null "$url"
          done
      - name: The smoke test
        run: npx --prefix web playwright test -c web/e2e/playwright.config.ts acceptance/t22
      - name: The servers' logs, when it failed
        if: failure()
        run: tail -n 200 "$RUNNER_TEMP"/logs/*.txt
