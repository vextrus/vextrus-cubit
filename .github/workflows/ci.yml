name: gate

on:
  push:
  pull_request:

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: pnpm verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out the tree
        uses: actions/checkout@v4

      # The pins live in the tree, not in this file: .nvmrc for Node,
      # packageManager for pnpm, cad/pyproject.toml for Python (C-06).
      - name: Install Node from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # corepack after setup-node, so the shims belong to the pinned Node;
      # `prepare --activate` installs exactly the packageManager pin.
      - name: Enable pnpm through corepack
        run: |
          corepack enable
          corepack prepare --activate
          pnpm --version

      # The uv pin is cad/pyproject.toml's [tool.uv] required-version; naming
      # it here too is the one place CI cannot read the tree, and a mismatch
      # makes uv refuse rather than resolve differently from the dev machine.
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: '0.12.5'
          enable-cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm verify

      # Q-01 and AC-8: verify reads the tree and writes only to gitignored
      # scratch. A dirty tree here means a stage wrote where it must not.
      - name: The tree is exactly as verify found it
        run: git status --porcelain --untracked-files=all | tee /dev/stderr | wc -l | grep -qx 0
