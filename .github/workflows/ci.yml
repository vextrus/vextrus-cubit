name: verify

# C-06: the gate's own toolchain, run the way a fresh clone runs it.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: fresh clone → install → verify → verify again
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Actions are pinned by commit, like everything else in this increment: a moving
      # major tag is remote code that can change under the gate between two runs.
      - name: Check out the tree
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # B-05: two checks in `vitest run` are claims about history — the ownership
          # boundary (an engine-maintained file a commit deleted must be back in the tree)
          # and AM-02 (inc-000's own commit carried no product tree). The default
          # fetch-depth: 1 fetches only the tip, so both would judge a truncated history:
          # one passing vacuously, the other reading the wrong commit as inc-000's. Full
          # history is the input those stages need, so CI fetches it.
          fetch-depth: 0

      - name: Node, from .nvmrc
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: pnpm, exact via corepack
        shell: bash
        run: |
          corepack enable
          corepack prepare --activate
          node --version
          pnpm --version

      - name: uv, for the pinned Python 3.13 in cad/
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Install, frozen
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: checkup — the machine's report
        shell: bash
        run: pnpm checkup

      - name: verify
        shell: bash
        run: pnpm verify | tee "${RUNNER_TEMP}/verify-1.txt"

      # AC-1, C-06: the roster of the real tree, judged against the real tree. Arming is a
      # directory question, so this step asks the directories — an independent answer to the
      # one verify printed, which is the only way a check on a script's own rule is a check.
      - name: The roster is the tree's own answer
        shell: bash
        run: |
          set -euo pipefail
          input_root() {
            case "$1" in
              typegen|build) echo src/app ;;
              db-drift) echo db/schema ;;
              method-hashes) echo src/core/methods ;;
              catalogue-drift) echo src/core/catalogue ;;
              cad-ruff) echo cad ;;
              cad-pytest) echo cad/tests ;;
              *) echo '' ;;
            esac
          }
          mapfile -t printed < <(grep '^verify: ' "${RUNNER_TEMP}/verify-1.txt")
          line=0
          for stage in typegen tsc eslint vitest db-drift method-hashes catalogue-drift \
                       cad-ruff cad-pytest build; do
            root="$(input_root "$stage")"
            if [ -n "$root" ] && [ ! -d "$root" ]; then
              want="^verify: ${stage} SKIP LANE_NOT_YET_BUILT\$"
            else
              want="^verify: ${stage} ok \\([0-9]+ms\\)\$"
            fi
            got="${printed[$line]:-<no line>}"
            if ! [[ "$got" =~ $want ]]; then
              echo "roster line $((line + 1)): expected /${want}/, got '${got}'"
              exit 1
            fi
            line=$((line + 1))
          done
          final="${printed[$line]:-<no line>}"
          if ! [[ "$final" =~ ^verify:\ ok\ \([0-9]+(\.[0-9]+)?s\)$ ]]; then
            echo "final line: expected 'verify: ok (<S>s)', got '${final}'"
            exit 1
          fi
          if [ "${#printed[@]}" -ne $((line + 1)) ]; then
            echo "the contract is one line per stage and the final line; got:"
            printf '%s\n' "${printed[@]}"
            exit 1
          fi

      - name: The tree is untouched
        shell: bash
        run: |
          git status --porcelain > "${RUNNER_TEMP}/porcelain.txt"
          if [ -s "${RUNNER_TEMP}/porcelain.txt" ]; then
            echo "verify modified the tree:"
            cat "${RUNNER_TEMP}/porcelain.txt"
            exit 1
          fi

      # Fresh-clone determinism is a four-step chain, and the fourth step is the one that
      # catches a stage that arms itself off something it wrote on the first run.
      - name: verify again — identical roster
        shell: bash
        run: |
          pnpm verify | tee "${RUNNER_TEMP}/verify-2.txt"
          roster() { grep '^verify: ' "$1" | sed -E 's/\(([0-9.]+)(ms|s)\)/(TIME)/'; }
          roster "${RUNNER_TEMP}/verify-1.txt" > "${RUNNER_TEMP}/roster-1.txt"
          roster "${RUNNER_TEMP}/verify-2.txt" > "${RUNNER_TEMP}/roster-2.txt"
          diff -u "${RUNNER_TEMP}/roster-1.txt" "${RUNNER_TEMP}/roster-2.txt"

      - name: The tree is still untouched
        shell: bash
        run: |
          git status --porcelain > "${RUNNER_TEMP}/porcelain-2.txt"
          if [ -s "${RUNNER_TEMP}/porcelain-2.txt" ]; then
            echo "the second verify modified the tree:"
            cat "${RUNNER_TEMP}/porcelain-2.txt"
            exit 1
          fi

  # V-E2E: "Runs in CI on every PR and by the harness gate." A job of its own rather than a
  # stage of verify: the lane needs a database and a browser, and verify is the check that
  # must stay runnable on a machine that has neither.
  e2e:
    name: V-E2E — build once, seed, serve on 3211, run the journeys
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      # C-07 puts PostgreSQL 16 on 127.0.0.1:5544, which is the address every default URL
      # in scripts/db-migrate.mjs names. AS-01 forbids Docker *in dev*, on the development
      # machine; a service container on a disposable CI runner is not that machine.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5544:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out the tree
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Node, from .nvmrc
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: pnpm, exact via corepack
        shell: bash
        run: |
          corepack enable
          corepack prepare --activate

      - name: Install, frozen
        shell: bash
        run: pnpm install --frozen-lockfile

      # A Playwright lane with no browser installed fails for a reason that is not the
      # code's. The baselines are Linux-rendered and this runner is the Linux they were
      # rendered for (ubuntu-24.04); --with-deps brings the system libraries chromium and
      # its font stack need.
      - name: chromium, with its system dependencies
        shell: bash
        run: pnpm exec playwright install --with-deps chromium

      # The whole lane, exactly as a developer runs it: build once, drop/recreate/migrate/
      # seed the scratch database, serve the build on 3211, run the journeys, exit with the
      # run's true status.
      - name: e2e
        shell: bash
        run: pnpm e2e

      - name: The tree is untouched
        shell: bash
        run: |
          git status --porcelain > "${RUNNER_TEMP}/porcelain-e2e.txt"
          if [ -s "${RUNNER_TEMP}/porcelain-e2e.txt" ]; then
            echo "the e2e lane modified the tree:"
            cat "${RUNNER_TEMP}/porcelain-e2e.txt"
            exit 1
          fi
