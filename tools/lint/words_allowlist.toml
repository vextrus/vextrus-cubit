# The words lint's allowlist (tools/lint/words.py; docs/design/m0-screens.md 1.1).
# Each entry: `msgid`, the message it lets off; `rule`, one of the lint's rules ("engine term", "add it
# again", "ask your MD", "reinforcement", "positional placeholder", "count without a plural");
# optionally `term`, the one word it lets off (any case); and `reason` (required). An entry that lets
# nothing off fails the lint.

# "Readers": m0-screens 4.5's own word for the two decoders (6.17: "Two decoders agree" became "two
# readers agree"). Each of these is 4.5's sentence verbatim, or its Readers section's.

[[allow]]
msgid = "drawings.files.held"
rule = "engine term"
term = "readers"
reason = "m0-screens 4.5's Held row, verbatim: \"Held: the two readers disagree, so it may be misread\"."

[[allow]]
msgid = "drawings.files.read"
rule = "engine term"
term = "readers"
reason = "m0-screens 4.5's Read row, verbatim: \"Read. Two readers agree\"."

[[allow]]
msgid = "drawings.files.read_bangla"
rule = "engine term"
term = "readers"
reason = "m0-screens 4.5's Read-with-flags row, verbatim: \"Read. Two readers agree. 1 flag: Bangla text\"."

[[allow]]
msgid = "drawings.files.second_reader"
rule = "engine term"
term = "reader"
reason = "m0-screens 4.5's Reading-a-DWG steps, verbatim: \"Checking it with a second reader\"."

[[allow]]
msgid = "drawings.reports.readers_agree"
rule = "engine term"
term = "readers"
reason = "m0-screens 4.5's Readers section, verbatim: \"✓ Read twice, by two independent readers, and they agree. …\"."

[[allow]]
msgid = "engine.decoders_agree.disagree"
rule = "engine term"
term = "readers"
reason = "m0-screens 4.5's Readers section, verbatim (\"The two readers found different contents in this file: …\")."

[[allow]]
msgid = "engine.decoders_agree.disagree"
rule = "engine term"
term = "reader"
reason = "m0-screens 4.5's Readers section, verbatim (\"… the second reader could not read 1 item\"; the owner's ruling \"Hold it\")."

[[allow]]
msgid = "drawings.reports.read_anyway"
rule = "engine term"
term = "readers"
reason = "m0-screens 4.5's Readers section, verbatim (\"The two readers found different contents in this file: …\"), for a held file read anyway."

[[allow]]
msgid = "drawings.reports.read_anyway"
rule = "engine term"
term = "reader"
reason = "m0-screens 4.5's Readers section, verbatim (\"… the second reader could not read 1 item\"), for a held file read anyway."

[[allow]]
msgid = "drawings.reports.read_anyway_pending"
rule = "engine term"
term = "readers"
reason = "m0-screens 4.5's Readers section, verbatim (\"The two readers found different contents in this file: …\"), for a held file read anyway while it is read again or after that reading did not finish (#165)."

[[allow]]
msgid = "drawings.reports.read_anyway_pending"
rule = "engine term"
term = "reader"
reason = "m0-screens 4.5's Readers section, verbatim (\"… the second reader could not read 1 item\"), for a held file read anyway while it is read again or after that reading did not finish (#165)."

[[allow]]
msgid = "drawings.reports.read_anyway_stopped"
rule = "engine term"
term = "readers"
reason = "m0-screens 4.5's Readers section, verbatim (\"The two readers found different contents in this file: …\"), for a held file read anyway while it is read again or after that reading did not finish (#165)."

[[allow]]
msgid = "drawings.reports.read_anyway_stopped"
rule = "engine term"
term = "reader"
reason = "m0-screens 4.5's Readers section, verbatim (\"… the second reader could not read 1 item\"), for a held file read anyway while it is read again or after that reading did not finish (#165)."

[[allow]]
msgid = "engine.decoders_agree.not_installed"
rule = "engine term"
term = "reader"
reason = "m0-screens 4.5's read-once words (\"This file was read once, not twice: … a fault on Vextrus's side, not in your file.\"), naming the second reader as 4.5's Failed row does."

[[allow]]
msgid = "engine.decoders_agree.not_pinned"
rule = "engine term"
term = "reader"
reason = "m0-screens 4.5's read-once words, naming the second reader as 4.5's Failed row does."

[[allow]]
msgid = "engine.decoders_agree.stopped"
rule = "engine term"
term = "reader"
reason = "m0-screens 4.5's read-once words, naming the second reader as 4.5's Failed row does."

[[allow]]
msgid = "engine.decoders_agree.too_many"
rule = "engine term"
term = "reader"
reason = "m0-screens 4.5's read-once words (\"the file over its limit\"), naming the second reader as 4.5's Failed row does."

[[allow]]
msgid = "engine.catalogue.decoders_agree"
rule = "engine term"
term = "readers"
reason = "The Check's name in 4.5's words (\"two readers agree\", m0-screens 4.5 and 6.2's \"… 40 sheets, two readers agree\")."

# "Add it again" where the file was not kept, or where the QS changes it first: m0-screens 4.5 refuses
# only the same file, already kept, added again.

[[allow]]
msgid = "drawings.files.old_version"
rule = "add it again"
reason = "m0-screens 4.5's Old AutoCAD version row, verbatim: the file re-saved as a 2018 DWG is a different file, so it is added."

[[allow]]
msgid = "drawings.uploads.empty"
rule = "add it again"
reason = "The empty file was not added, so adding it again (copied again) is not a re-add."

[[allow]]
msgid = "drawings.uploads.malformed"
rule = "add it again"
reason = "The file could not be received and nothing was added, so adding it again is not a re-add."

[[allow]]
msgid = "drawings.uploads.no_name"
rule = "add it again"
reason = "The file was not added, and is renamed first, so adding it again is not a re-add."

[[allow]]
msgid = "drawings.uploads.one_at_a_time"
rule = "add it again"
reason = "None of the files was added, so adding them again one at a time is not a re-add."

[[allow]]
msgid = "platform.storage.missing"
rule = "add it again"
reason = "Vextrus's copy is gone, and the same file added again is taken as its replacement, not refused (drawings.uploads.replaced: \"… This one replaces that copy\")."

# "Ask your MD" only for what an MD can do (m0-screens 1.4: the MD is read-only but for Members and
# access).

[[allow]]
msgid = "platform.auth.no_access"
rule = "ask your MD"
reason = "An MD invites anyone to the Developer (m0-screens 1.4, Who invites whom)."

[[allow]]
msgid = "platform.auth.not_allowed"
rule = "ask your MD"
reason = "A QS is refused only what 1.4 keeps for the MD: inviting anyone but a Vextrus Engineer, and ending others' access."

[[allow]]
msgid = "projects.projects.scoped_member_cannot_create"
rule = "ask your MD"
reason = "An MD gives access to all projects (m0-screens 4.4's invite and Projects column)."

# A count whose number is never 1.

[[allow]]
msgid = "engine.pdf_report.too_many_pages"
rule = "count without a plural"
reason = "{limit} is the page limit for one PDF, MAX_PAGES, 1000 (engine/read/pdf/walk.py), never 1."

[[allow]]
msgid = "platform.auth.password_too_short"
rule = "count without a plural"
reason = "{min} is the password's least length, 12 (vextrus/settings/auth.py), never 1."

# 21a: a read job that could not be queued rolls the add back (vextrus/takeoff/tasks/read_file.py).

[[allow]]
msgid = "takeoff.read_file.not_started"
rule = "add it again"
reason = "Nothing was kept: the add and its read job are one transaction, rolled back together, so adding the file again is a first add, never the refused re-add of 4.5."

[[allow]]
msgid = "takeoff.read_file.not_started_waiting"
rule = "add it again"
reason = "The file is in the set, waiting with no read job; adding the same contents again is what queues its reading (read_file.add attaches the job and answers takeoff.read_file.reading_started), so 4.5's refusal does not apply."

# The chrome's catalogues (web/src/<feature>/locales/en.po), read since T-W329: each entry is
# m0-screens' own words or a count the code guards from reading "1 sheets" (the line cited).

[[allow]]
msgid = "You have no access to any Developer at the moment. Ask your MD, or Vextrus, for an invitation."
rule = "ask your MD"
reason = "m0-screens 4.1 (line 530), verbatim: \"… Ask your MD, or Vextrus, for an invitation.\": inviting a member is an act an MD can do."

[[allow]]
msgid = "{name} was not added: it could not be received. If its name is very long, shorten it and add it again. If this keeps happening, tell Vextrus."
rule = "add it again"
reason = "Said of a file that was not kept (m0-screens 4.5 lets \"add it again\" stand only there): nothing of it is in the Drawing Set."

[[allow]]
msgid = "{name} was not added. Vextrus could not add it just now. Add it again in a minute."
rule = "add it again"
reason = "Said of a file that was not kept (m0-screens 4.5 lets \"add it again\" stand only there): nothing of it is in the Drawing Set."

[[allow]]
msgid = "Readers"
rule = "engine term"
term = "readers"
reason = "m0-screens 4.5's Readers section (line 735): the report panel's heading for the two readers' verdict."

[[allow]]
msgid = "Vextrus could not tell whether {name} was added. If it is not in the list in a minute, add it again."
rule = "add it again"
reason = "Said of a file that was not kept (m0-screens 4.5 lets \"add it again\" stand only there): nothing of it is in the Drawing Set."

[[allow]]
msgid = "{name} was not added. <0/> Add it again."
rule = "add it again"
reason = "Said of a file that was not kept (m0-screens 4.5 lets \"add it again\" stand only there): nothing of it is in the Drawing Set."

[[allow]]
msgid = "{name} was not added. Vextrus can’t be reached. Check your connection and add it again."
rule = "add it again"
reason = "Said of a file that was not kept (m0-screens 4.5 lets \"add it again\" stand only there): nothing of it is in the Drawing Set."

[[allow]]
msgid = "{name} was not added: Vextrus cannot use its name. Rename it and add it again."
rule = "add it again"
reason = "Said of a file that was not kept (m0-screens 4.5 lets \"add it again\" stand only there): nothing of it is in the Drawing Set."

[[allow]]
msgid = "{projectName}’s Drawing Set: {count} Open it to see why."
rule = "count without a plural"
reason = "{count} is the whole phrase \"… added; … was not added\" (DrawingSetPage.tsx:610, severalAdded), its counts worded with their own plurals: no number stands here."

[[allow]]
msgid = "{projectName}’s Drawing Set: {count}"
rule = "count without a plural"
reason = "{count} is the whole phrase \"… added; … was not added\" (DrawingSetPage.tsx:610, severalAdded), its counts worded with their own plurals: no number stands here."

[[allow]]
msgid = "<0/><1>, {count} sheets</1>"
rule = "count without a plural"
reason = "Shown only when the row holds more than one sheet (SheetList.tsx:517, row.sheets.length > 1): it never reads \"1 sheets\"."

[[allow]]
msgid = "{count, plural, one {# {discipline} sheet has one source} other {# {discipline} sheets have one source each}}"
rule = "count without a plural"
reason = "{discipline}/{kind} is a name before \"sheets\", not a count; the count is the plural's # and is worded one/other."

[[allow]]
msgid = "One title on {count} sheets"
rule = "count without a plural"
reason = "Shown only when n > 2 (questionWords.tsx:40; two sheets read \"One title on two sheets\"): it never reads \"1 sheets\"."

[[allow]]
msgid = "<0/><1>, {count} copies</1>"
rule = "count without a plural"
reason = "A copies row holds two or more sheets (model.ts:272, holds.length > 1): it never reads \"1 copies\"."

[[allow]]
msgid = "{n, plural, one {Drawing list set: # {kind} sheet.} other {Drawing list set: # {kind} sheets.}}"
rule = "count without a plural"
reason = "{discipline}/{kind} is a name before \"sheets\", not a count; the count is the plural's # and is worded one/other."

[[allow]]
msgid = "Trace: {file}, as each of the two readers read it"
rule = "engine term"
term = "readers"
reason = "m0-screens 4.5's own word for the two readers (6.17, line 1571: \"two readers agree\" / \"the two readers disagree\"); the held file's Trace shows each reader's reading."

[[allow]]
msgid = "<0/><1>Held: the two readers disagree</1>"
rule = "engine term"
term = "readers"
reason = "m0-screens 6.17 (line 1571): \"two readers agree\" / \"the two readers disagree\" is 4.5's own wording, and 6.2 (lines 1167, 1187) words Step 1's file rows so."

[[allow]]
msgid = "{tag} answered. Confirms {number} {kept} and excludes {dropped} as superseded."
rule = "count without a plural"
reason = "\"excludes\" is the verb after the Confirmed sheet's number, not a plural noun: one sheet is confirmed and the rest excluded."

[[allow]]
msgid = "Set this file aside: I’ll re-save it from AutoCAD (open it, run AUDIT, save) and add it again"
rule = "add it again"
reason = "m0-screens 5's held-file Question (lines 1021 and 1588), option 2 verbatim: \"Set this file aside: I'll re-save it from AutoCAD … and add it again\"."

[[allow]]
msgid = "{name}: {openText} Questions open"
rule = "count without a plural"
reason = "Shown only when more than one is open (Step1Inspector.tsx:51 says \"1 Question open\" for one)."

[[allow]]
msgid = "Confirm {n}"
rule = "count without a plural"
reason = "No noun follows the count: \"Confirm 1\" reads right; the bar's verb takes a number, not a plural."

[[allow]]
msgid = "A file is held: the two readers disagree"
rule = "engine term"
term = "readers"
reason = "m0-screens 6.17 (line 1571): \"two readers agree\" / \"the two readers disagree\" is 4.5's own wording, and 6.2 (lines 1167, 1187) words Step 1's file rows so."

[[allow]]
msgid = "Confirm {n}, leave out {m}"
rule = "count without a plural"
reason = "No noun follows the count: \"Confirm 1\" reads right; the bar's verb takes a number, not a plural."

[[allow]]
msgid = "Basement {n}"
rule = "count without a plural"
reason = "{n} is a floor number, not a count (storeys.tsx:61: the second basement and below)."

[[allow]]
msgid = "{count} with no Discipline"
rule = "count without a plural"
reason = "No noun follows the count, and one reads \"1 with no Discipline\" (Step1Inspector.tsx:61 guards it)."

[[allow]]
msgid = "{name}: no drawing list; numbering runs {range} with gaps or repeats (see the list); {found} found."
rule = "count without a plural"
reason = "{range} is a span of sheet numbers and \"gaps\" follows \"with\": no count stands before a plural noun."

[[allow]]
msgid = "two readers agree"
rule = "engine term"
term = "readers"
reason = "m0-screens 6.17 (line 1571): \"two readers agree\" / \"the two readers disagree\" is 4.5's own wording, and 6.2 (lines 1167, 1187) words Step 1's file rows so."

[[allow]]
msgid = "{n} / {total} settled"
rule = "count without a plural"
reason = "A fraction of settled sheets, no noun after the count: \"1 / 1 settled\" reads right (m0-screens 5's progress row)."

[[allow]]
msgid = "{n, plural, one {# sheet, two readers agree} other {# sheets, two readers agree}}"
rule = "engine term"
term = "readers"
reason = "m0-screens 6.17 (line 1571): \"two readers agree\" / \"the two readers disagree\" is 4.5's own wording, and 6.2 (lines 1167, 1187) words Step 1's file rows so."

[[allow]]
msgid = "{tag} answered. Confirms the latest copy of {number} and excludes the other {others, plural, one {# copy} other {# copies}} as superseded."
rule = "count without a plural"
reason = "\"excludes\" is the verb after the Confirmed sheet's number, not a plural noun: one sheet is confirmed and the rest excluded."

[[allow]]
msgid = "It sits beside a gap in the numbering that {tag} asks about; answer {tag} and it joins the bulk act."
rule = "count without a plural"
reason = "{tag} is a Question's tag (\"Q2\"), not a count, and \"asks\" is its verb; m0-screens 6.5 words the bar so (#320)."
