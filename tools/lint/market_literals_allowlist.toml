# The market-literal scan's allowlist (tools/lint/market_literals.py; ADR 0038).
# Each entry: `path`, a glob from the repository's root; `reason`, why a market is written there
# (required); and optionally `literal`, the one literal it allows. An entry matching no file fails.

[[allow]]
path = "vextrus/seed/**"
reason = """The demo seed is data: the invented demo project on the Bangladesh Market \
(docs/design/m0-screens.md §7), for walking the product."""

[[allow]]
path = "web/src/i18n/pseudo-tag.ts"
literal = "en-XB"
reason = """The test-only pseudo right-to-left language's tag (docs/design/m0-screens.md §1.8; ADR 0038): \
never a Market's language, never shipped (web/scripts/check-dist.mjs fails the build if it is)."""

[[allow]]
path = "vextrus/platform/migrations/0004_bangladesh_market.py"
reason = """The Bangladesh Market's data migration (ticket 02; ADR 0038): the Market row is where a \
market's currency, borrowed locale, time zone and unit systems are written, as data."""
