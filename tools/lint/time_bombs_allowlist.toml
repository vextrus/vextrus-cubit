# The time-bomb lint's allowlist (tools/lint/time_bombs.py; #308).
# Each entry excuses only the hits of one `kind` (`read` or `commit`) in one `function` (its qualified
# name, or `<module>`) or at one `line` of the files `path` (a glob from the root) names; `reason`
# says why that fixed time is never compared with that clock read or commit (required). An entry that
# excuses no hit fails. Narrow entries only: a second hit in a listed file is still reported.

[[allow]]
path = "scripts/factory/tests/test_launch_round1.py"
kind = "commit"
function = "main"
reason = "It commits a fake main checkout; launch never reads a commit's time, and its times are fake log lines or an injected now."

